<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;800;900&family=IBM+Plex+Sans:wght@300;400;600&display=swap"
      rel="stylesheet"
    />

    <link href="https://api.fontshare.com/v2/css?f[]=clash-display@300,400,500,700&display=swap" rel="stylesheet">
    <title>Speculative Style Studio</title>
  </head>
  <body>
    <header>
      <h1>SPECULATIVE STYLE STUDIO</h1>
    </header>

    <!-- NAV BAR ELEMENT -->
    <div class="nav-bar">
      <button class="nav-item"><a href="index.html">[ MAIN.EXE ]</a></button>
      <button class="nav-item">
        <a href="pages/readme.html">[ README.TXT ]</a>
      </button>
      <button class="nav-item">
        <a href="pages/catalog.html">[ CATALOG.CSV ]</a>
      </button>
      <button class="nav-item">
        <a href="/writing.html" id="writing-test">[ WRITING.DOCX ]</a>
      </button>
    </div>

    <!-- MAIN WINDOW ELEMENT -->
    <div class="main-window">
      <div class="title-bar">
        <span class="window-title">~/USERS/GUEST/STUDIO/MAIN.EXE </span>
        <span class="x-close">X</span>
      </div>

      <!-- MAIN WINDOW CONTENT -->
      <div class="window-content">
        <div class="split-view">
          <div class="avatar-controls">
            <div class="avatar-box">
              <picture>
                <img id="avatar" src="" alt="Style studio avatar" />
              </picture>
              <div id="clothing-layers"></div>
            </div>
            <button class="undo-btn" id="undo-btn">> UNDO</button>
            <button class="btn speculate-btn" id="speculate-btn" disabled>
              > GENERATE SPECULATIONS
            </button>
          </div>
          <div class="clothes">
            <p>SELECT_CATEGORY</p>
            <div class="dropdown-container">
              <button class="btn category-btn" id="toggle-tops">> TOPS</button>
              <div class="dropdown-menu" id="menu-tops"></div>
            </div>

            <div class="dropdown-container">
              <button class="btn category-btn" id="toggle-bottoms">
                > BOTTOMS
              </button>
              <div class="dropdown-menu" id="menu-bottoms"></div>
            </div>

            <div class="dropdown-container">
              <button class="btn category-btn" id="toggle-footwear">
                > FOOTWEAR
              </button>
              <div class="dropdown-menu" id="menu-footwear"></div>
            </div>

            <div class="dropdown-container">
              <button class="btn category-btn" id="toggle-accessories">
                > ACCESSORIES
              </button>
              <div class="dropdown-menu" id="menu-accessories"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="vignette-window">
      <div class="vignette-text-header">
        GENERATING SPECULATIONS<span>...</span>
      </div>
      <div class="vignette-text">
        Choose at least 3 pieces. You will then be able to generate speculations
        about yourself and the character you just created.
      </div>
    </div>
    <script src="assets/js/script.js"></script>
  </body>
</html>
